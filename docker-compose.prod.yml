services:
  db:
    image: postgres:17-alpine

    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    image: ghcr.io/prs2rnn/django-notes-app

    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      - db

    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles

  caddy:
    image: caddy:2

    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    dns:
      - 1.1.1.1
      - 8.8.8.8

    depends_on:
      - web

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile

      - static_data:/staticfiles
      - media_data:/media

      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  media_data:
  static_data:

  caddy_data:
  caddy_config:
