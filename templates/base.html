{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="This is my Django app for taking notes."
    />
    <title>My Notes</title>
    <link rel="shortcut icon" href="{% static 'img/favicon.png' %}" type="image/png" />
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <a
          href="{% url 'notes_list' %}"
          class="navbar-brand text-uppercase"
          style="color: black"
        >
          <img
            src="{% static 'img/logo.webp' %}"
            alt=""
            width="30"
            height="24"
            class="d-inline-block align-text-top"
          />
          My Notes
        </a>
      </div>
    </nav>
    <main>
      {% block content %}
      {% endblock content %}
    </main>
    <footer class="border-top py-4 text-center">
      <div class="container">
        <p>&copy; Andrey Perestoronin, 2026</p>
      </div>
    </footer>
  </body>
</html>
