{% extends 'base.html' %}

{% block content %}
<div class="container">
  <h2 class="h2">Edit note</h2>

  <form method="post">
    {% csrf_token %}
    <div class="mb-2">
      {{ form.title.label_tag }}
      {{ form.title }}
    </div>
    <div class="mb-2">
      {{ form.body.label_tag }}
      {{ form.body }}
    </div>
    <div class="my-3">
      <button type="submit" class="btn btn-primary">Save</button>
      <a href="{% url 'note_detail' note.id %}" class="btn btn-secondary ms-2">Undo</a>
    </div>
  </form>
</div>
{% endblock content %}
