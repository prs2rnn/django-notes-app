{% extends 'base.html' %}

{% block content %}
<div class="container">
  {% if notes %}
  <ul class="list-group list-group-flush">
    {% for note in notes %}
    <a href="{% url 'note_detail' note.id %}" class="list-group-item list-group-item-action mt-1">
      {{note.title}}
    </a>
    {% endfor %}
  </ul>
  {% else %}
  <p>There aren't notes yet</p>
  {% endif %}
  <a href="{% url 'note_create' %}" class="btn btn-success my-3">➕ Add note</a>
</div>
{% endblock content %}
